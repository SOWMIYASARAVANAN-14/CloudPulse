name: CloudPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build-publish:
    name: Build, Test & Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven Tests and Verify
        run: mvn --batch-mode clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudpulse:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudpulse:${{ github.sha }}

  deploy:
    name: Automatic Deployment to AWS
    needs: test-build-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Trigger Rolling Update via ASG Instance Refresh
        id: refresh
        run: |
          echo "Starting ASG Instance Refresh for cloudpulse-asg..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name cloudpulse-asg \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 60}' \
            --query "InstanceRefreshId" \
            --output text)
          echo "Instance refresh triggered with ID: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      - name: Monitor Instance Refresh Progress
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          echo "Monitoring instance refresh status for ID: $REFRESH_ID"
          for i in {1..40}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name cloudpulse-asg \
              --query "InstanceRefreshes[?InstanceRefreshId=='${REFRESH_ID}'].Status" \
              --output text)
            PERCENT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name cloudpulse-asg \
              --query "InstanceRefreshes[?InstanceRefreshId=='${REFRESH_ID}'].PercentageComplete" \
              --output text)
            echo "Time elapsed: $((i * 15))s | Status: $STATUS | Progress: ${PERCENT}%"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh successfully completed!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackSuccessful" ] || [ "$STATUS" = "RollbackFailed" ]; then
              echo "Instance refresh terminated with status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timeout waiting for instance refresh completion."
          exit 1

      - name: Verify Live Deployment and Health Endpoint
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names cloudpulse-alb \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          echo "Target ALB DNS: $ALB_DNS"
          echo "Waiting for health check to confirm status: UP and new version..."
          for i in {1..20}; do
            HEALTH_JSON=$(curl -s "http://$ALB_DNS/api/health" || true)
            echo "Attempt $i: $HEALTH_JSON"
            if echo "$HEALTH_JSON" | grep -q '"status":"UP"'; then
              echo "Deployment verified! Live health endpoint returned status: UP."
              echo "Querying /api/info..."
              curl -s "http://$ALB_DNS/api/info"
              echo ""
              exit 0
            fi
            sleep 10
          done
          echo "Health check verification failed."
          exit 1
